<style>
  /* Committed single-theme design: deep, warm dark editorial world built
     around the photography. Every colour is painted explicitly. */
  :root{
    color-scheme:dark;
    --ground:#0A0B08;
    --panel:#12150F;
    --panel-2:#171B13;
    --bone:#EFEAE0;
    --bone-dim:#9C9F91;
    --line:#242819;
    --line-soft:#1B1E15;
    --brass:#C89A3C;
    --brass-dim:#8A6C2C;

    --display:"Didot","Bodoni 72","Bodoni MT",Didot,"Playfair Display",
      Georgia,"Times New Roman",serif;
    --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,
      "Helvetica Neue",Arial,sans-serif;

    --pad:24px;
    --maxw:1240px;
  }

  @media (min-width:900px){ :root{ --pad:56px; } }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--ground);
    color:var(--bone);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.68;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  img{display:block;max-width:100%;}

  a{color:inherit;}
  a:focus-visible,button:focus-visible{outline:1px solid var(--brass);outline-offset:4px;}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}

  .label{
    font-size:10.5px;
    letter-spacing:.26em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--brass);
  }

  h1,h2,h3,blockquote{
    font-family:var(--display);
    font-weight:400;
    letter-spacing:-.005em;
    text-wrap:balance;
    margin:0;
  }

  h1{font-size:clamp(2.5rem,5.4vw,4.25rem);line-height:1.06;}
  h2{font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.12;max-width:18ch;}
  h3{font-size:1.35rem;line-height:1.25;}

  p{margin:0;max-width:60ch;}

  /* ---------- top bar ---------- */

  .topbar{
    position:fixed;
    inset:0 0 auto 0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px var(--pad);
    background:transparent;
    border-bottom:1px solid transparent;
    transition:background .35s ease,border-color .35s ease,padding .35s ease;
  }
  .topbar.stuck{
    background:#0A0B08F2;
    border-bottom-color:var(--line);
    padding-top:14px;
    padding-bottom:14px;
    backdrop-filter:blur(8px);
  }

  .topbar__name{
    font-family:var(--display);
    font-size:clamp(1.28rem,2.5vw,1.9rem);
    line-height:1.05;
    letter-spacing:.02em;
    text-decoration:none;
    white-space:nowrap;
  }

  .topbar__right{display:flex;align-items:center;gap:14px;}

  .langs{display:flex;align-items:center;gap:2px;}
  .langs button{
    appearance:none;
    background:none;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:11px;
    font-weight:600;
    letter-spacing:.16em;
    color:var(--bone-dim);
    padding:6px 7px;
    transition:color .25s ease;
  }
  .langs button:hover{color:var(--bone);}
  .langs button[aria-current="true"]{color:var(--brass);}
  .langs i{font-style:normal;color:var(--line);}

  .topbar__tel{
    white-space:nowrap;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bone);
    border:1px solid var(--line);
    padding:9px 15px;
    transition:border-color .3s ease,color .3s ease;
  }
  .topbar__tel:hover{border-color:var(--brass);color:var(--brass);}

  .topbar__tel-short{display:none;}

  @media (max-width:820px){
    .topbar{padding-left:18px;padding-right:18px;gap:10px;}
    .topbar__right{gap:8px;}
    .topbar__tel{border-color:var(--brass-dim);color:var(--brass);}
    .topbar__tel-full{display:none;}
    .topbar__tel-short{display:inline;}
  }

  @media (max-width:560px){
    .topbar{padding-top:14px;padding-bottom:14px;gap:8px;}
    .topbar__name{font-size:1.02rem;letter-spacing:.03em;}
    .langs{gap:0;}
    .langs i{display:none;}
    .langs button{font-size:9.5px;letter-spacing:.06em;padding:8px 5px;}
    .topbar__tel{padding:9px 11px;font-size:9.5px;letter-spacing:.1em;}
  }

  /* ---------- hero ---------- */

  .hero{
    position:relative;
    min-height:100svh;
    display:grid;
    grid-template-columns:1fr;
    align-items:end;
  }

  .hero__media{position:relative;grid-area:1/1;height:100svh;overflow:hidden;}
  .hero__media img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:78% 50%;
    filter:saturate(.92) contrast(1.04);
  }
  .hero__media::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(to top,#0A0B08 6%,#0A0B08B0 54%,#0A0B0838 100%);
  }

  .hero__body{
    grid-area:1/1;
    position:relative;
    z-index:2;
    width:100%;
    padding-bottom:clamp(56px,9vh,110px);
    padding-top:130px;
  }
  .hero__inner{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}

  .hero h1{margin:24px 0 26px;max-width:15ch;}
  .hero h1 em{display:block;font-style:italic;color:var(--brass);}

  .hero__sub{font-size:1.05rem;color:var(--bone-dim);max-width:48ch;margin-bottom:36px;}

  .hero__cta{display:flex;flex-wrap:wrap;gap:10px;}

  .hero__meta{
    display:flex;
    flex-wrap:wrap;
    gap:12px 30px;
    margin-top:44px;
    padding-top:22px;
    border-top:1px solid var(--line);
    max-width:640px;
  }
  .hero__meta span{
    font-size:10.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }

  @media (min-width:900px){
    .hero__media::after{
      background:
        linear-gradient(to top,#0A0B08 4%,#0A0B0800 46%),
        linear-gradient(to right,#0A0B08 6%,#0A0B08CC 32%,#0A0B0800 70%);
    }
  }

  @media (max-width:560px){
    .hero__media img{object-position:48% 50%;}
    .hero__body{padding-top:92px;padding-bottom:44px;}
    .hero h1{margin:18px 0 20px;}
    .hero__sub{font-size:1rem;margin-bottom:26px;}
    .hero__cta{gap:8px;}
    .hero__cta .cta{flex:1 1 100%;text-align:center;padding:17px 20px;}
    .hero__meta{margin-top:30px;padding-top:16px;gap:8px 18px;}
    .hero__meta span{font-size:9.5px;letter-spacing:.16em;}
  }

  .cta{
    display:inline-block;
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:600;
    text-decoration:none;
    padding:16px 28px;
    color:var(--ground);
    background:var(--brass);
    border:1px solid var(--brass);
    transition:background .3s ease,color .3s ease;
  }
  .cta:hover{background:transparent;color:var(--brass);}

  .cta--ghost{background:transparent;color:var(--bone);border-color:var(--line);}
  .cta--ghost:hover{background:transparent;color:var(--brass);border-color:var(--brass);}

  /* ---------- sections ---------- */

  .sec{padding:clamp(72px,11vh,132px) 0;}
  .sec--line{border-top:1px solid var(--line-soft);}

  .sec__head{display:grid;gap:18px;margin-bottom:clamp(40px,6vh,72px);}
  @media (min-width:900px){
    .sec__head{grid-template-columns:1fr 1fr;gap:48px;align-items:end;}
  }
  .sec__head h2{margin-top:16px;}
  .sec__head p{color:var(--bone-dim);}

  /* ---------- offer rows ---------- */

  .row{
    display:grid;
    gap:26px;
    align-items:center;
    padding:clamp(34px,5vh,58px) 0;
    border-top:1px solid var(--line-soft);
  }
  .row:last-child{border-bottom:1px solid var(--line-soft);}

  @media (min-width:860px){
    .row{grid-template-columns:1fr 1fr;gap:64px;}
    .row--flip .row__media{order:2;}
  }

  .row__media{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--panel);}
  .row__media img{
    width:100%;height:100%;
    object-fit:cover;
    transition:transform 1.1s cubic-bezier(.2,.7,.25,1);
  }
  .row:hover .row__media img{transform:scale(1.035);}

  .row__body{display:grid;gap:16px;align-content:start;}
  .row__body h3{margin-top:6px;}
  .row__body p{color:var(--bone-dim);}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;padding:0;list-style:none;}
  .tags li{
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--bone-dim);
    border:1px solid var(--line);
    padding:7px 11px;
  }

  /* ---------- quote band ---------- */

  .band{position:relative;min-height:62vh;display:grid;align-items:center;}
  .band__media{grid-area:1/1;height:100%;overflow:hidden;}
  .band__media img{width:100%;height:100%;object-fit:cover;}
  .band__media::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to right,#0A0B08E8,#0A0B08A6 60%,#0A0B08CC);
  }
  .band__body{grid-area:1/1;position:relative;z-index:2;padding:64px 0;}
  .band blockquote{
    font-size:clamp(1.6rem,3.2vw,2.6rem);
    line-height:1.24;
    max-width:20ch;
    margin:18px 0 22px;
  }
  @media (max-width:560px){ .band blockquote{font-size:1.45rem;max-width:none;} }

  .band cite{
    font-style:normal;
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }

  /* ---------- about ---------- */

  .about{display:grid;gap:30px;align-items:center;}
  @media (min-width:860px){ .about{grid-template-columns:.85fr 1.15fr;gap:64px;} }
  .about__media{aspect-ratio:5/4;overflow:hidden;background:var(--panel);}
  .about__media img{width:100%;height:100%;object-fit:cover;}
  .about__body{display:grid;gap:18px;align-content:center;}
  .about__body p{color:var(--bone-dim);}

  /* ---------- credentials ---------- */

  .creds{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
  @media (min-width:760px){ .creds{grid-template-columns:1fr 1fr;} }

  .cred{
    background:var(--panel);
    padding:clamp(24px,3.4vw,40px);
    display:grid;
    gap:10px;
    align-content:start;
    transition:background .35s ease;
  }
  .cred:hover{background:var(--panel-2);}
  .cred h3{font-size:1.5rem;}
  .cred p{color:var(--bone-dim);font-size:.96rem;}

  /* ---------- process ---------- */

  .steps{list-style:none;margin:0;padding:0;counter-reset:s;}
  .steps li{
    counter-increment:s;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:6px 24px;
    padding:26px 0;
    border-top:1px solid var(--line-soft);
  }
  .steps li:last-child{border-bottom:1px solid var(--line-soft);}
  .steps li::before{
    content:counter(s,decimal-leading-zero);
    font-family:var(--display);
    font-size:1.05rem;
    color:var(--brass-dim);
    padding-top:.25em;
    min-width:38px;
  }
  .steps h3{font-size:1.18rem;margin-bottom:6px;}
  .steps p{color:var(--bone-dim);font-size:.98rem;}

  /* ---------- contact ---------- */

  .contact{display:grid;gap:32px;align-items:stretch;}
  @media (min-width:900px){ .contact{grid-template-columns:1.05fr .95fr;gap:64px;} }

  .contact__panel{
    background:var(--panel);
    border:1px solid var(--line-soft);
    padding:clamp(26px,3.6vw,44px);
    display:grid;
    gap:26px;
    align-content:center;
  }
  .contact__panel dl{margin:0;display:grid;gap:22px;}
  .contact__panel dt{margin-bottom:7px;}
  .contact__panel dd{
    margin:0;
    font-family:var(--display);
    font-size:clamp(1.35rem,2.4vw,1.85rem);
    line-height:1.2;
  }
  .contact__panel dd a{
    text-decoration:none;
    border-bottom:1px solid var(--brass-dim);
    padding-bottom:2px;
    transition:color .3s ease,border-color .3s ease;
  }
  .contact__panel dd a:hover{color:var(--brass);border-color:var(--brass);}

  .contact__body{display:grid;gap:20px;align-content:center;}
  .contact__body p{color:var(--bone-dim);}

  .contact__strip{margin-top:clamp(40px,6vh,72px);aspect-ratio:32/9;overflow:hidden;}
  @media (max-width:700px){ .contact__strip{aspect-ratio:16/9;} }
  .contact__strip img{width:100%;height:100%;object-fit:cover;}

  /* ---------- footer ---------- */

  footer{border-top:1px solid var(--line-soft);padding:34px 0 46px;}
  .foot{
    display:grid;
    gap:14px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }
  @media (min-width:760px){ .foot{grid-template-columns:1fr auto;align-items:center;} }
  .foot a{text-decoration:none;}
  .foot a:hover{color:var(--brass);}
  .credits{
    grid-column:1/-1;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:none;
    color:#6E7166;
    max-width:70ch;
  }

  /* ---------- reveal ---------- */

  .rv{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.25,1);}
  .rv.in{opacity:1;transform:none;}
  .rv:nth-child(2){transition-delay:.07s;}
  .rv:nth-child(3){transition-delay:.14s;}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .rv{opacity:1;transform:none;transition:none;}
    *{transition:none !important;}
  }
</style>

(function(){
  var LANGS=[["pl","PL"],["en","EN"],["de","DE"],["uk","UA"]];
  var box=document.getElementById('langs');
  var current='pl';

  function apply(code){
    var dict=I18N[code]||I18N.pl;
    current=code;
    document.documentElement.lang=code;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v=dict[el.getAttribute('data-i18n')];
      if(v!=null) el.textContent=v;
    });
    document.querySelectorAll('[data-i18n-alt]').forEach(function(el){
      var v=dict[el.getAttribute('data-i18n-alt')];
      if(v!=null) el.setAttribute('alt',v);
    });
    box.querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-current', b.dataset.code===code ? 'true':'false');
    });
    try{ localStorage.setItem('sw-lang',code); }catch(e){}
  }

  LANGS.forEach(function(l,i){
    if(i){ var sep=document.createElement('i'); sep.textContent='/'; box.appendChild(sep); }
    var b=document.createElement('button');
    b.type='button'; b.textContent=l[1]; b.dataset.code=l[0];
    b.addEventListener('click',function(){ apply(l[0]); });
    box.appendChild(b);
  });

  var saved=null;
  try{ saved=localStorage.getItem('sw-lang'); }catch(e){}
  apply(saved && I18N[saved] ? saved : 'pl');

  var bar=document.getElementById('topbar');
  var onScroll=function(){ bar.classList.toggle('stuck', window.scrollY>40); };
  onScroll();
  window.addEventListener('scroll',onScroll,{passive:true});

  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items=document.querySelectorAll('.rv');
  if(reduce||!('IntersectionObserver' in window)){
    items.forEach(function(el){el.classList.add('in');});
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{rootMargin:'0px 0px -12% 0px',threshold:.12});
  items.forEach(function(el){io.observe(el);});
})();
</script>
